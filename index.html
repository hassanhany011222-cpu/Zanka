<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هدية من قلبي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Readex+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff1f5;--bg2:#ffd6e3;--ink:#4a1730;--soft:#8a4a66;--rose:#ff4d8d;--rose2:#ff8fb7;--card:rgba(255,255,255,.72);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0f1d;--bg2:#4a1730;--ink:#ffe8f0;--soft:#f0b3cc;--card:rgba(255,255,255,.09)}}
:root[data-theme="dark"]{--bg1:#2a0f1d;--bg2:#4a1730;--ink:#ffe8f0;--soft:#f0b3cc;--card:rgba(255,255,255,.09)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;overflow-x:hidden}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:44px 20px;text-align:center}
h1{font-size:clamp(1.9rem,7vw,3rem);font-weight:900;line-height:1.4}
h1 span{color:var(--rose)}
.sub{color:var(--soft);margin-top:10px}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.4);border-radius:26px;padding:26px 20px;box-shadow:0 14px 40px rgba(255,77,141,.18)}
.btn{border:0;cursor:pointer;font:inherit;font-weight:700;color:#fff;padding:13px 32px;border-radius:999px;background:linear-gradient(135deg,var(--rose),var(--rose2));box-shadow:0 10px 28px rgba(255,77,141,.4);transition:transform .2s}
.btn:hover{transform:scale(1.05)}
/* lock */
#lock{min-height:100vh;display:grid;place-items:center}
#lock .card{width:100%;max-width:400px}
.lockicon{font-size:3.4rem;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.hint{margin:16px 0;padding:10px 14px;border-radius:14px;background:rgba(255,77,141,.12);color:var(--soft);font-weight:700}
input[type=password],input[type=text]{width:100%;font:inherit;text-align:center;padding:13px;border-radius:14px;border:2px solid var(--rose2);background:transparent;color:var(--ink);outline:none;margin-bottom:14px}
input:focus{border-color:var(--rose)}
.err{color:var(--rose);min-height:1.6em;margin-top:10px;font-weight:700}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
/* main */
#main{display:none}
#main.show{display:block;animation:rise 1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.frame{background:#fff;padding:12px 12px 44px;border-radius:8px;box-shadow:0 16px 38px rgba(74,23,48,.3);transform:rotate(-3deg);max-width:300px;margin:28px auto;position:relative}
.frame::after{content:"❤️";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:1.4rem}
.ph{width:100%;aspect-ratio:1/1;border-radius:4px;background:linear-gradient(135deg,var(--rose2),var(--rose));display:grid;place-items:center;font-size:3rem;color:rgba(255,255,255,.8);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.letter{text-align:right;margin-top:26px;line-height:2.25;font-size:1.12rem;font-weight:400;font-family:'Readex Pro','Cairo',Tahoma,Arial,sans-serif;padding:30px 24px}
.letter h2{text-align:center;color:var(--rose);margin-bottom:14px;font-family:'Cairo',Tahoma,sans-serif;font-weight:900}
.letter p{margin-bottom:12px;opacity:0;transform:translateY(18px);animation:fadein .9s ease forwards}
@keyframes fadein{to{opacity:1;transform:none}}
.sign{text-align:left!important;font-weight:700;color:var(--rose)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:26px}
.gift .ph{aspect-ratio:4/5;font-size:4rem}
.gift h3{margin:12px 0 4px}
.gift p{color:var(--soft);font-size:.95rem}
.music{position:fixed;z-index:5;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;width:54px;height:54px;border-radius:50%;border:0;font-size:1.5rem;cursor:pointer;background:linear-gradient(135deg,var(--rose),var(--rose2));box-shadow:0 8px 24px rgba(255,77,141,.5);display:none}
.music.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#boom{position:fixed;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,77,141,.35),transparent 65%)}
#boom.show{animation:boomtxt 3.2s ease both}
#boom .ar{font-size:clamp(3rem,16vw,6rem);font-weight:900;color:#fff;text-shadow:0 0 30px #ff4d8d,0 6px 24px rgba(74,23,48,.6)}
#boom .en{font-size:clamp(1.6rem,8vw,3rem);font-weight:700;color:#fff;text-shadow:0 0 24px #ff4d8d,0 4px 16px rgba(74,23,48,.6);margin-top:6px}
@keyframes boomtxt{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.15)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
.bh{position:fixed;left:50%;top:50%;z-index:6;pointer-events:none;animation:fly 1.7s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
footer{position:relative;z-index:1;text-align:center;padding:26px;color:var(--soft)}
</style>
</head>
<body>
<canvas id="hearts"></canvas>

<div class="wrap" id="lock">
  <div class="card" id="lockcard">
    <div class="lockicon">🔐</div>
    <h1 style="font-size:1.7rem;margin:8px 0">هدية مستنياكي <span>💝</span></h1>
    <p class="sub">مش هتتفتح غير لو عرفتي كلمة السر</p>
    <div class="hint">💡 تلميح: أول زنقة بينا 😉</div>
    <input type="password" id="pw" placeholder="اكتبي كلمة السر" autocomplete="off">
    <button class="btn" id="go">افتحي 💗</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="wrap" id="main">
  <h1>حبيبتي <span id="nm"></span> 💗</h1>
  <p class="sub">دي هدية صغيرة من قلب كبير</p>

  <div class="frame"><div class="ph" id="herphoto">📷</div></div>

  <div class="card letter" id="letter">
    <h2>💌 رسالة ليكي</h2>
  </div>

  <h1 style="font-size:1.7rem;margin-top:44px">هديتك <span>🎁</span></h1>
  <div class="grid">
    <div class="card gift"><div class="ph" id="g1">🥤</div><h3>علبة بيبسي 🥤</h3><p>علشان أي مرة تشربيها تفتكريني.</p></div>
    <div class="card gift"><div class="ph" id="g2">🍫</div><h3>شوكولاتة بصورتك 🍫</h3><p>حلوة زيك… بس إنتي أحلى بكتير.</p></div>
  </div>
  <p style="margin-top:34px"><button class="btn" id="burst">ابعتيلي قلب 💗</button></p>
</div>

<footer>اتعملت بحب ❤️</footer>
<div id="boom"></div>
<button class="music" id="music" aria-label="الأغنية">🎵</button>
<audio id="song" src="song.mp3" loop preload="auto"></audio>

<script>
/* ===== الإعدادات: غيّر هنا ===== */
var PASSWORD = "27112026";      // ← كلمة السر (الإجابة على: أول زنقة بينا)
var HER_NAME = "سميرة";          // ← اسمها
var HIS_NAME = "حسن";            // ← اسمك
var LETTER = [
  "حبيبتي، مش عارف أبدأ منين… بس عارف إني عايز أقولك كل اللي جوايا مرة واحدة.",
  "فاكر أول زنقة بينا؟ كانت أحلى زنقة في الدنيا، وهتفضل كده، لأن بعدها حياتي اتغيرت للأحسن.",
  "إنتي مش بس حبيبتي، إنتي أماني وبيتي والضحكة اللي برجعلها آخر اليوم. معاكي بحس إن الدنيا أبسط وأحلى، وإن أي تعب بيعدّي.",
  "ضحكتك بتصلّح يومي كله، وصوتك بيهديني حتى لو كنت تعبان أو مضغوط.",
  "علشان كده اخترتلك هدية تشبهك: بيبسي، لأنك الفوّارة اللي بتحرّك الدنيا حواليّا، وشوكولاتة بصورتك، علشان حتى الحلاوة اللي باكلها يبقى وشك الحلو فيها.",
  "والتاريخ اللي فتحتي بيه الهدية ده بالنسبالي مش مجرد أرقام… ده حاجة حلوة محفورة في قلبي.",
  "أوعدك أفضل جنبك في الفرحة والزعل، وأحاول كل يوم أكون أحسن حد يستاهلك.",
  "بحبك يا أحلى حاجة حصلتلي، وهفضل أحبك أكتر كل يوم."
];
/* الصور: حطها في نفس الفولدر بالأسماء دي */
var PHOTOS = {herphoto:"photo.jpg", g1:"pepsi.jpg", g2:"chocolate.jpg"};
/* الأغنية: song.mp3 في نفس الفولدر */
/* ================================ */

document.getElementById('nm').textContent = HER_NAME;
var cv=document.getElementById('hearts'),cx=cv.getContext('2d'),W,H,hs=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',size);size();
function add(x,y,b){hs.push({x:x,y:y,s:10+Math.random()*22,v:b?-(2+Math.random()*3):-(.4+Math.random()*.9),dx:(Math.random()-.5)*(b?3:.6),a:.25+Math.random()*.5})}
for(var i=0;i<20;i++)add(Math.random()*innerWidth,Math.random()*innerHeight);
(function draw(){
  cx.clearRect(0,0,W,H);
  if(Math.random()<.05)add(Math.random()*W,H+20);
  hs=hs.filter(function(h){return h.y>-40});
  hs.forEach(function(h){h.y+=h.v;h.x+=h.dx;cx.globalAlpha=h.a;cx.font=h.s+'px serif';cx.fillText('\u2764\uFE0F',h.x,h.y)});
  requestAnimationFrame(draw);
})();

Object.keys(PHOTOS).forEach(function(id){
  var t=new Image();
  t.onload=function(){var el=document.getElementById(id);el.textContent='';el.appendChild(t)};
  t.src=PHOTOS[id];
});

var song=document.getElementById('song'),mb=document.getElementById('music');
function norm(s){return s.replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-1632}).trim().toLowerCase().replace(/[\s\/\-.]/g,'')}
function unlock(){
  var v=document.getElementById('pw').value;
  if(norm(v)===norm(PASSWORD)){
    document.getElementById('lock').style.display='none';
    var m=document.getElementById('main');m.classList.add('show');
    mb.style.display='block';
    song.volume=.8;
    var p=song.play();
    if(p&&p.then){p.then(function(){mb.classList.add('spin')}).catch(function(){})}
    for(var i=0;i<40;i++)add(Math.random()*W,H,true);
    var L=document.getElementById('letter');
    LETTER.forEach(function(t,i){var e=document.createElement('p');e.textContent=t;e.style.animationDelay=(.6+i*1.1)+'s';L.appendChild(e)});
    var s=document.createElement('p');s.className='sign';s.textContent='بحبك… '+HIS_NAME+' ❤️';s.style.animationDelay=(.6+LETTER.length*1.1)+'s';L.appendChild(s);
    scrollTo(0,0);
  }else{
    var c=document.getElementById('lockcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
    document.getElementById('err').textContent='لأ مش دي 😅 فكّري تاني… أول زنقة بينا!';
  }
}
document.getElementById('go').onclick=unlock;
document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')unlock()};
mb.onclick=function(){if(song.paused){song.play();mb.classList.add('spin')}else{song.pause();mb.classList.remove('spin')}};
document.getElementById('burst').onclick=function(){
  var b=document.getElementById('boom');
  b.innerHTML='<div><div class="ar">بحبك ❤️</div><div class="en">I love you 💖</div></div>';
  b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
  var emo=['❤️','💖','💗','💕','💘'];
  for(var i=0;i<70;i++){
    var s=document.createElement('span');s.className='bh';
    var a=Math.random()*6.283,d=120+Math.random()*Math.min(W,H)*.6;
    s.textContent=emo[i%5];
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
    s.style.fontSize=(16+Math.random()*30)+'px';
    document.body.appendChild(s);
    setTimeout((function(el){return function(){el.remove()}})(s),1900);
  }
  for(var j=0;j<30;j++)add(Math.random()*W,H,true);
};
</script>
</body>
</html>
